<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>M² — MeshCore Live Monitor</title>
  <script>
    window.M2PlayIntro = true;
    try {
      window.M2PlayIntro = !sessionStorage.getItem('m2-web-intro-played-v1');
      if (window.M2PlayIntro) sessionStorage.setItem('m2-web-intro-played-v1', '1');
      else document.documentElement.classList.add('intro-seen');
    } catch {}
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/m2-logo.svg">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=202611160935">
  <link rel="stylesheet" href="styles.css?v=202611160935">
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-screen="Live" aria-current="page"><span class="nav-icon" data-icon="live"></span><span>Live</span></button>
      <button class="nav-item" data-screen="My log"><span class="nav-icon" data-icon="log"></span><span>My log</span></button>
      <button class="nav-item" data-screen="Channels"><span class="nav-icon" data-icon="channels"></span><span>Channels</span></button>
      <button class="nav-item" data-screen="Map"><span class="nav-icon" data-icon="map"></span><span>Map</span></button>
      <button class="nav-item" data-screen="Settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
      <button class="nav-item" data-screen="Guide"><span class="nav-icon" data-icon="guide"></span><span>Guide</span></button>
    </nav>
  </div>

  <div id="intro" class="intro" aria-label="M² introduction">
    <canvas id="signal-canvas" aria-hidden="true"></canvas>
    <div class="intro-brand">
      <img src="assets/m2-logo.svg" alt="M²">
      <div class="intro-title">MeshCore Live Monitor</div>
      <div class="intro-tagline">FOLLOW THE SIGNAL</div>
    </div>
  </div>
  <script src="stats-client.js?v=202611160935"></script>
  <script src="guide-data.js?v=202611160935"></script>
  <script src="guide.js?v=202611160935"></script>
  <script src="map-core.js?v=202611160935"></script>
  <script src="vendor/leaflet/leaflet.js?v=202611160935"></script>
  <script src="map-screen.js?v=202611160935"></script>
  <script src="channels-core.js?v=202611160935"></script>
  <script src="app.js?v=202611160935"></script>
</body>
</html>
